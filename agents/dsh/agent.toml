tui_commit = "73ff99fbed56563bf154d719effd09f9f9725349"

[defaults]
providers = []
models = []
rules = ["chinese", "terminal", "cpp-local-search"]
skills = ["repo-navigation", "maintain-agent-config"]
plugins = ["tui", "codex-auth", "cursor-auth", "auto-review", "review-context", "tmux-context", "git-worktrees"]
