schema_version = 1
adapter_version = "pi-1"
subagents_commit = "e955e29c51b7a6cce37e1108cd2d6c57a77e151c"

[defaults]
providers = []
models = []
rules = ["chinese", "terminal", "cpp-local-search"]
skills = ["model-delegate"]
plugins = ["pi-subagents", "pi-permissions", "model-delegate"]
mcp = []

[defaults.agent_options.runtime]
engine = "node"

[defaults.agent_options.resources]
roles = ["scout", "reviewer"]
prompts = ["implement", "review", "plan"]
themes = ["everforest-dark"]
extensions = []

[defaults.agent_options.ui]
theme = "everforest-dark"
quiet_startup = true
hide_thinking = false

[defaults.agent_options.discovery]
project_resources = false
external_skills = []

[defaults.agent_options.task_keeper]
enabled = false
second_view_enabled = false
max_second_view_rounds = 2

[defaults.agent_options.model_delegate]
enabled = true
backends = ["pi"]
allowed_modes = ["review", "investigate"]
presets = ["general", "context", "challenge", "plan", "research", "review", "scout"]
max_run_seconds = 1800
context_budget_tokens = 1800

[defaults.agent_options.permissions]
policy_ref = "project-default"
readonly_roots = []
denied_roots = []

[policies.project-default]
schema_version = 1
default = "deny"
rules = []

# 仅供显式选择的受管候选工具。FilePolicy 仍检查角色、task grant 与写租约。
[policies.task-keeper-candidate]
schema_version = 1
default = "deny"
[[policies.task-keeper-candidate.rules]]
id = "candidate-read"
kind = "file"
effect = "allow"
tool_ids = ["tk_read", "tk_grep", "tk_find", "tk_ls", "tk_edit"]
operations = ["read", "list", "search"]
root_ref = "project"
relative_path = "."
match = "subtree"
[[policies.task-keeper-candidate.rules]]
id = "candidate-write"
kind = "file"
effect = "allow"
tool_ids = ["tk_write", "tk_edit"]
operations = ["write", "create"]
root_ref = "project"
relative_path = "."
match = "subtree"

# 显式选择ReadSeek的普通配方候选策略：在上者基础上附加固定readseek-node外部工具执行授权。
[policies.readseek-candidate]
schema_version = 1
default = "deny"
[[policies.readseek-candidate.rules]]
id = "candidate-read"
kind = "file"
effect = "allow"
tool_ids = ["tk_read", "tk_grep", "tk_find", "tk_ls", "tk_edit"]
operations = ["read", "list", "search"]
root_ref = "project"
relative_path = "."
match = "subtree"
[[policies.readseek-candidate.rules]]
id = "candidate-write"
kind = "file"
effect = "allow"
tool_ids = ["tk_write", "tk_edit"]
operations = ["write", "create"]
root_ref = "project"
relative_path = "."
match = "subtree"
[[policies.readseek-candidate.rules]]
id = "candidate-readseek-node"
kind = "command"
effect = "allow"
tool_ids = ["bash"]
operations = ["execute"]
command_ref = "tool:readseek-node"
[[policies.readseek-candidate.rules]]
id = "candidate-readseek-git"
kind = "command"
effect = "allow"
tool_ids = ["bash"]
operations = ["execute"]
command_ref = "tool:readseek-git"
[[policies.readseek-candidate.rules]]
id = "candidate-readseek-rg"
kind = "command"
effect = "allow"
tool_ids = ["bash"]
operations = ["execute"]
command_ref = "tool:readseek-rg"

# Codex 原生权限按完整文件系统操作授权；写入仍要求显式 worktree 与写租约。
[policies.delegate-worktree]
schema_version = 1
default = "deny"
[[policies.delegate-worktree.rules]]
id = "delegate-project-files"
kind = "file"
effect = "allow"
tool_ids = ["read", "grep", "find", "ls", "write", "edit", "rename"]
operations = ["read", "list", "search", "write", "create", "delete", "rename"]
root_ref = "project"
relative_path = "."
match = "subtree"

# 带ReadSeek验收的Codex委托策略变体：附加固定readseek-node外部工具执行授权。
[policies.delegate-worktree-readseek]
schema_version = 1
default = "deny"
[[policies.delegate-worktree-readseek.rules]]
id = "delegate-project-files"
kind = "file"
effect = "allow"
tool_ids = ["read", "grep", "find", "ls", "write", "edit", "rename"]
operations = ["read", "list", "search", "write", "create", "delete", "rename"]
root_ref = "project"
relative_path = "."
match = "subtree"
[[policies.delegate-worktree-readseek.rules]]
id = "delegate-readseek-node"
kind = "command"
effect = "allow"
tool_ids = ["bash"]
operations = ["execute"]
command_ref = "tool:readseek-node"
[[policies.delegate-worktree-readseek.rules]]
id = "delegate-readseek-git"
kind = "command"
effect = "allow"
tool_ids = ["bash"]
operations = ["execute"]
command_ref = "tool:readseek-git"
[[policies.delegate-worktree-readseek.rules]]
id = "delegate-readseek-rg"
kind = "command"
effect = "allow"
tool_ids = ["bash"]
operations = ["execute"]
command_ref = "tool:readseek-rg"

[resources.scout]
kind = "role"
path = "agents/pi/roles/scout.md"
scope = "global"
model_role = "scout"
tools = ["read", "grep", "find", "ls"]
read_roots = ["project"]
write_roots = []
thinking = "medium"
nested = false

[resources.reviewer]
