schema_version = 1
adapter_version = "pi-2"

[defaults]
providers = []
models = []
rules = ["chinese", "terminal", "cpp-local-search"]
skills = ["repo-navigation", "safe-linux-scripting"]
plugins = []
mcp = []

[defaults.agent_options.runtime]
engine = "node"
[defaults.agent_options.resources]
prompts = ["daily-implement", "daily-review"]
themes = ["catppuccin"]
extensions = []
[defaults.agent_options.discovery]
project_resources = false
[defaults.agent_options.collaboration]
enabled = false
[defaults.agent_options.ui]
theme = "catppuccin-mocha"
quietStartup = "header"
tuiMode = "fullscreen"
editorPaddingX = 0
outputPad = 1
autocompleteMaxVisible = 5
cacheWarming = "streaming"
[defaults.agent_options.ui.terminal]
hyperlinks = "auto"
images = "auto"
trueColor = "auto"
[defaults.agent_options.settings]
defaultThinkingLevel = "medium"
steeringMode = "one-at-a-time"
followUpMode = "one-at-a-time"
[defaults.agent_options.settings.compaction]
enabled = true
reserveTokens = 16384
keepRecentTokens = 20000
[defaults.agent_options.settings.retry]
enabled = true
maxRetries = 3
[defaults.agent_options.settings.retry.provider]
maxRetries = 0
[defaults.agent_options.settings.codemode]
mode = "on"
inlineBudget = 3000

[resources.daily-implement]
kind = "prompt"
path = "agents/pi/prompts/daily-implement.md"
scope = "global"
[resources.daily-review]
kind = "prompt"
path = "agents/pi/prompts/daily-review.md"
scope = "global"
