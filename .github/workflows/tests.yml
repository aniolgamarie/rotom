name: Offline manager tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Prepare locked dependencies
        run: uv sync --locked --python '${{ matrix.python }}'
      - name: Run isolated offline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: .venv/bin/python -m pytest -q -p no:cacheprovider
      - name: Confirm lock remains unchanged
        run: git diff --exit-code -- uv.lock locks

  omp-command-parser:
    # 只运行仓库合成字符串的纯解析测试，绝不读取历史 HOME 或启动 agent。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Run synthetic parser regressions
        run: bun test tests/omp_command_history.test.ts tests/omp_command_history_js.test.ts
      - name: Report supported syntax and known semantic gaps
        run: bun scripts/check-omp-command-history.ts
      - name: Confirm runtime locks remain unchanged
        run: git diff --exit-code -- locks uv.lock

  taskkeeper-mock:
    # 此 job 使用已有隔离入口，只运行显式列出的 mock，不启动 Pi 宿主。
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - name: Prepare mock sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Prepare locked mock dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/pi/tooling
      - name: Run isolated Task Keeper mock tests
        run: node agents/pi/packages/task-keeper/scripts/test-mock.mjs
      - name: Confirm locks remain unchanged
        run: git diff --exit-code -- locks tests/fixtures/pi/tooling/package-lock.json
