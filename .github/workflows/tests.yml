name: Offline manager tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Prepare locked dependencies
        run: uv sync --locked --python '${{ matrix.python }}'
      - name: Run isolated offline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: .venv/bin/python -m pytest -q -p no:cacheprovider
      - name: Check public documentation and path hygiene
        run: .venv/bin/python scripts/check-public-docs.py
      - name: Confirm lock remains unchanged
        run: git diff --exit-code -- uv.lock locks

  omp-command-parser:
    # 只运行仓库合成字符串的纯解析测试，绝不读取历史 HOME 或启动 agent。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Run synthetic parser regressions
        run: bun test ./tests/omp_command_history.test.ts ./tests/omp_command_history_js.test.ts ./tests/omp_shell_scenarios.test.ts ./agents/omp/packages/omp-permission-control/standalone.test.ts ./agents/omp/packages/omp-permission-control/native-bash.test.ts
      - name: Report supported syntax and known semantic gaps
        run: bun scripts/check-omp-command-history.ts
      - name: Confirm runtime locks remain unchanged
        run: git diff --exit-code -- locks uv.lock

  pi-status-observer:
    # 只运行仓库自有观察代码和fake API；不安装或加载Pi/社区插件/MCP。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 官方v6.0.0 tag的commit；核对来源见native-validation-plan.md。
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Run own status observer with synthetic public API
        run: node tests/pi_status_observer.test.mjs
      - name: Confirm runtime locks remain unchanged
        run: git diff --exit-code -- locks uv.lock
