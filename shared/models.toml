schema_version = 1
# OAuth 模型目录由插件在登录后发现；不编造静态 model ID。
# 公共预设包含默认可选 Coding Plan 订阅与 DeepSeek 按量 API；凭据独立。

[models.deepseek_flash_openai]
provider = "deepseek_openai"
remote_id = "deepseek-flash"
name = "DeepSeek-V4.1-Flash"
input = ["text", "image"]
reasoning = true
reasoning_efforts = ["low", "high", "max"]
context_window = 1048576
max_output_tokens = 393216
source = "https://api-docs.deepseek.com/api/list-models/"

[models.deepseek_flash_openai.pricing]
currency = "USD"
per_tokens = 1000000
source = "https://api-docs.deepseek.com/quick_start/pricing/"
checked_on = "2026-09-27"
schedule = "Peak: Monday-Friday 01:00-04:00 and 06:00-10:00 UTC; other times off-peak"
standard = {input = 0.30, output = 1.20, cache_read = 0.006}
off_peak = {input = 0.15, output = 0.60, cache_read = 0.003}

[models.deepseek_flash_openai.native.pi]
thinkingLevelMap = {minimal = "low", low = "low", medium = "high", high = "high", xhigh = "high", max = "max"}

[models.deepseek_flash_openai.native.pi.compat]
requiresReasoningContentOnAssistantMessages = true
thinkingFormat = "deepseek"
supportsDeveloperRole = false
supportsReasoningEffort = true
maxTokensField = "max_tokens"

[models.deepseek_flash_openai.native.omp.thinking]
minLevel = "low"
maxLevel = "max"
mode = "effort"

[models.deepseek_flash_openai.native.omp.compat]
supportsDeveloperRole = false
supportsReasoningEffort = true
maxTokensField = "max_tokens"
reasoningEffortMap = {minimal = "low", low = "low", medium = "high", high = "high", xhigh = "high", max = "max"}
supportsToolChoice = false
requiresReasoningContentForToolCalls = true
requiresAssistantContentForToolCalls = true
extraBody = {thinking = {type = "enabled"}}

[models.deepseek_flash_anthropic]
provider = "deepseek_anthropic"
remote_id = "deepseek-flash"
name = "DeepSeek-V4.1-Flash"
input = ["text", "image"]
reasoning = true
reasoning_efforts = ["low", "high", "max"]
context_window = 1048576
max_output_tokens = 393216
source = "https://api-docs.deepseek.com/api/list-models/"
pricing = {currency = "USD", per_tokens = 1000000, source = "https://api-docs.deepseek.com/quick_start/pricing/", checked_on = "2026-09-27", schedule = "Peak: Monday-Friday 01:00-04:00 and 06:00-10:00 UTC; other times off-peak", standard = {input = 0.30, output = 1.20, cache_read = 0.006}, off_peak = {input = 0.15, output = 0.60, cache_read = 0.003}}

