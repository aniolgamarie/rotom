schema_version = 1

[providers.codex]
protocol = "oauth-dynamic"
auth_kind = "oauth"

[providers.cursor]
protocol = "oauth-dynamic"
auth_kind = "oauth"

# 官方直连 API 预设。各协议使用独立 provider ID，共享同一个私人密钥引用。
[providers.deepseek_openai]
protocol = "openai-compatible"
auth_kind = "api-key"
base_url = "https://api.deepseek.com"
credential_ref = "secret:deepseek_key"
omp_auth_header = true

[providers.deepseek_anthropic]
protocol = "anthropic-messages"
auth_kind = "api-key"
base_url = "https://api.deepseek.com/anthropic"
credential_ref = "secret:deepseek_key"

[providers.kimi_openai]
protocol = "openai-compatible"
auth_kind = "api-key"
base_url = "https://api.moonshot.cn/v1"
credential_ref = "secret:kimi_key"

[providers.kimi_anthropic]
protocol = "anthropic-messages"
auth_kind = "api-key"
base_url = "https://api.moonshot.cn/anthropic"
credential_ref = "secret:kimi_key"

[providers.glm_openai]
protocol = "openai-compatible"
auth_kind = "api-key"
base_url = "https://open.bigmodel.cn/api/paas/v4/"
credential_ref = "secret:glm_key"

[providers.glm_anthropic]
protocol = "anthropic-messages"
auth_kind = "api-key"
base_url = "https://open.bigmodel.cn/api/anthropic"
credential_ref = "secret:glm_key"

# Coding Plan 订阅凭据独立于旧 API key，不自动复用。

[providers.kimi_code_openai]
protocol = "openai-compatible"
auth_kind = "api-key"
base_url = "https://api.kimi.com/coding/v1"
credential_ref = "secret:kimi_code_key"

[providers.kimi_code_anthropic]
protocol = "anthropic-messages"
auth_kind = "api-key"
base_url = "https://api.kimi.com/coding/"
credential_ref = "secret:kimi_code_key"

[providers.glm_coding_openai]
protocol = "openai-compatible"
auth_kind = "api-key"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
credential_ref = "secret:glm_coding_key"

[providers.glm_coding_anthropic]
protocol = "anthropic-messages"
auth_kind = "api-key"
base_url = "https://open.bigmodel.cn/api/anthropic"
credential_ref = "secret:glm_coding_key"
