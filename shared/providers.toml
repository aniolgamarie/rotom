schema_version = 1

[providers.codex]
protocol = "oauth-dynamic"
auth_kind = "oauth"

[providers.cursor]
protocol = "oauth-dynamic"
auth_kind = "oauth"

# DeepSeek 按量 API。各协议使用独立 provider ID，共享私人密钥引用。
[providers.deepseek_openai]
protocol = "openai-compatible"
auth_kind = "api-key"
base_url = "https://api.deepseek.com"
credential_ref = "secret:deepseek_key"
omp_auth_header = true

[providers.deepseek_anthropic]
protocol = "anthropic-messages"
auth_kind = "api-key"
base_url = "https://api.deepseek.com/anthropic"
credential_ref = "secret:deepseek_key"

[providers.kimi_code_openai]
protocol = "openai-compatible"
auth_kind = "api-key"
base_url = "https://api.kimi.com/coding/v1"
credential_ref = "secret:kimi_code_key"

[providers.kimi_code_anthropic]
protocol = "anthropic-messages"
auth_kind = "api-key"
base_url = "https://api.kimi.com/coding/"
credential_ref = "secret:kimi_code_key"

[providers.glm_coding_openai]
protocol = "openai-compatible"
auth_kind = "api-key"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
credential_ref = "secret:glm_coding_key"

[providers.glm_coding_anthropic]
protocol = "anthropic-messages"
auth_kind = "api-key"
base_url = "https://open.bigmodel.cn/api/anthropic"
credential_ref = "secret:glm_coding_key"
