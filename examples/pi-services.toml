# Base示例默认不选模块；逐项选择后须显式lock/sync/apply。
# 精确候选/真实字段/数据与退出边界见specs/005-rebuild-pi-toolkit/optional-module-recipes.md。
schema_version = 1

[machine]
id = "pi-services-demo"
default_profile = "pi-base"

[overrides.providers.example]
protocol = "openai-compatible"
base_url = "https://model.example.invalid/v1"
auth_kind = "api-key"
credential_ref = "secret:model_key"

[overrides.models.main]
provider = "example"
remote_id = "fictional-exact-model"
input = ["text"]

[overrides.profiles.pi-base]
providers = ["example"]
models = ["main"]
plugins = []
mcp = []

[overrides.profiles.pi-base.roles]
main = "main"

[secrets]
model_key = ""

# 可把plugins改为["cache-hit-monitor"]，mcp改为["pi-context7"]或["pi-brave"]。
# Context7 4.4.2：可无key；若添加credential_ref，则该引用启动前必须有值。
# Brave 2.1.4：需在secrets设置pi_brave_key；只公开brave_web_search。
# 工具白名单不限制summary/Pro等收费参数，账号/原生服务验证尚未运行。
# Playwright CLI 0.1.22：仅skills显式加入playwright-cli后按锁准备受管wrapper。
# 主运行session自动独立，不传-s；NO_UPDATE_NOTIFIER=1；浏览器二进制另行授权准备。
# Cursor 1.4.39：只用本实例Pi OAuth；不提供环境token，不复用Keychain/IDE。
# 选择pi-cursor时同步启用固定cursor provider与精确模型声明（模型/账号仍待原生验证）：
# [overrides.providers.cursor]
# protocol = "oauth-dynamic"
# auth_kind = "oauth"
# [overrides.models.cursor-main]
# provider = "cursor"
# remote_id = "fictional-cursor-model"
# input = ["text"]
# 将上方当前profile的providers/models/plugins/roles.main分别替换为
# ["cursor"] / ["cursor-main"] / ["pi-cursor"] / "cursor-main"，不重复创建TOML表。
# 原生显式/login及账号请求另行授权；禁用保留auth/cache/journal，不从个人资料自动迁移。
# 其余未准入plugins/mcp选择仍exit2；本示例不启动服务、不提供账号通过证据。
