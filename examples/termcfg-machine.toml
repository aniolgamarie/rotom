# 虚构示例；真实路径由 init-local 在私人 XDG 配置目录创建。
machine_id = "example-machine"
target_home = "/home/example-user"
private_state_root = "/home/example-user/.local/state/termcfg/machines/example-machine"
components = ["zsh", "tmux"]

# Herdr 是可选组件，不自动加入已有选择：
# ./termcfg init-local --edit --component zsh --component tmux --component herdr
# components = ["zsh", "tmux", "herdr"]
# 仅管理 target_home 下 .config/herdr/config.toml，不接管 session/socket/cache。
