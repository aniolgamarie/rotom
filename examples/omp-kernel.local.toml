# 复制到仓库外的 WSL Linux 文件系统后填写；不要在本文件提交真实密钥。
# 建议目录权限 0700、文件权限 0600。~ 按当前 WSL HOME 展开一次。
schema_version = 1

[machine]
id = "wsl-omp-kernel"
default_profile = "omp-kernel"

[machine.paths]
instances_root = "~/agentcfg-omp/instances"
state_root = "~/agentcfg-omp/state"
cache_root = "~/agentcfg-omp/cache"

[machine.environment]
inherit = []

# runner 默认让 Codex child 直接连接。机器需要代理时才取消下一表注释；
# 只写无凭据的proxy origin，不要包含userinfo、token、query或fragment。
# [machine.environment.values]
# CODEX_DELEGATE_PROXY_URL = "http://127.0.0.1:10808"

# 企业地址只保存在仓库外的这份私人机器文件里；空值表示尚未填写。
# 推荐运行 model url kimi_tf / model url zhipu_tf 隐藏输入完整服务地址。
# 需要匹配公开 provider 的协议和模型 ID，不能任意换成厂商官方端点。
[local_values]
tf_openai_url = ""
tf_anthropic_url = ""

# API key 保存在共享 agentcfg/secrets.toml；隐藏输入：
# ./agentcfg --local /绝对路径/本文件 --profile omp-kernel model key kimi_tf
# ./agentcfg --local /绝对路径/本文件 --profile omp-kernel model key zhipu_tf

# omp-kernel 使用仓库内 omp-permission-control 扩展与独立权限运行包。
# 主审省略时使用会话当前主模型；需要便宜模型时，可在对应 profile 的
# agent_options.permission_control 中设置 reviewer_model 为已选择的模型 ID。
# remote_fallback_model 是独立远程降级模型，只有主审超时、服务失败、无效输出、
# unsupported 或 unavailable 时才尝试；有效 allow/ask/deny、取消或机械证据失败不复审。
# local/lfm2.5-230m 仅在完整安装时兜底 ask/deny，审批流程不会下载它。
# 会话命令：/permission-control smart、manual、status、explain。
# 本示例不会安装或切换本机 OMP；交付前需完成 patched runtime 构建与锁核验。
