schema_version = 1
id = "pi-default"
agent = "pi"
providers = []
models = []
rules = ["chinese", "terminal", "cpp-local-search"]
skills = ["cpp-database-kernel", "neovim-plugin-development", "safe-linux-scripting", "model-delegate"]
plugins = ["pi-subagents", "pi-permissions", "model-delegate", "pi-todo", "loop-guard", "colorful-footer"]
mcp = []

[roles]
# 未显式绑定时继承公共 Coding Plan 默认；本机角色覆盖优先。
# Cursor 等 OAuth 执行模型需本机明确绑定，登录与模型选择分别处理。

[agent_options.runtime]
engine = "node"

[agent_options.resources]
roles = ["scout", "reviewer"]
prompts = ["commit", "debug", "docs", "explain", "implement", "perf", "plan", "pr", "refactor", "review", "security", "test"]
themes = ["everforest-dark"]
extensions = []

[agent_options.discovery]
project_resources = false
external_skills = []

[agent_options.ui]
theme = "everforest-dark"
quiet_startup = true
hide_thinking = false

[agent_options.permissions]
policy_ref = "project-default"
readonly_roots = []
denied_roots = []

[agent_options.task_keeper]
enabled = false
second_view_enabled = false
max_second_view_rounds = 2
check_ids = []

[agent_options.model_delegate]
enabled = true
backends = ["pi"]
allowed_modes = ["review", "investigate"]
presets = ["general", "context", "challenge", "plan", "research", "review", "scout"]
max_run_seconds = 1800
context_budget_tokens = 1800
