schema_version = 1
id = "omp-validation"
agent = "omp"
providers = ["omp-smoke"]
models = ["omp-large", "omp-small"]
rules = ["omp-fixture-one", "omp-fixture-two"]
skills = ["full-package"]
plugins = ["rotom-health"]
mcp = ["echo-stdio"]

[roles]
main = "omp-large"
smol = "omp-small"

[agent_options.discovery]
project_resources = false
project_roots = []

[agent_options.resources]
prompts = ["rotom-review"]
themes = ["rotom-dark"]

[agent_options.ui]
theme_dark = "rotom-dark"
theme_light = "rotom-dark"

[agent_options.ui.keybindings]
"app.model.cycleForward" = "Ctrl+P"
"app.history.search" = []
