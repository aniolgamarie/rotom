##### =========================
#####   基础设置
##### =========================

# 减少按键延迟，同时为 SSH 等高延迟环境保留少量缓冲
set -g escape-time 10

# 启用 extended-keys 支持（修复 pi Enter 键问题；tmux 3.2+）
if-shell 'tmux -V | awk '\''{ split($2, v, "."); exit !((v[1] > 3) || (v[1] == 3 && v[2] >= 2)) }'\''' \
  'set -g extended-keys on'
if-shell 'tmux -V | awk '\''{ split($2, v, "."); exit !((v[1] > 3) || (v[1] == 3 && v[2] >= 2)) }'\''' \
  'set -g extended-keys-format csi-u'

# 使用 POSIX shell 作为可用回退，再在 tmux server 中解析当前 zsh 路径。
# 这避免安装脚本把机器专属绝对路径写回 Git 工作区。
set -g default-shell /bin/sh
run-shell 'starter_zsh_path="$(command -v zsh 2>/dev/null || true)"; if [ -n "$starter_zsh_path" ]; then tmux set-option -g default-shell "$starter_zsh_path"; fi'

# 窗口/面板编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 默认关闭鼠标，避免不同终端的选择行为冲突
set -g mouse off

# 系统剪贴板支持
set -g set-clipboard on

# 允许可见 pane 使用 DCS passthrough（tmux 3.3+）
if-shell 'tmux -V | awk '\''{ split($2, v, "."); exit !((v[1] > 3) || (v[1] == 3 && v[2] >= 3)) }'\''' \
  'set -g allow-passthrough on'


##### =========================
#####   终端能力（真彩 + UTF-8）
##### =========================

# 保留 tmux 默认的 SSH/DISPLAY 环境变量，并补充 locale 与真彩提示。
# 固定数组下标可避免重复 source-file 时不断追加条目。
set -g update-environment[100] "LANG"
set -g update-environment[101] "LC_ALL"
set -g update-environment[102] "LC_CTYPE"
set -g update-environment[103] "COLORTERM"

set -g assume-paste-time 0
set -g display-panes-active-colour default
set -g display-panes-colour default
set -g pane-border-format "#{pane_index} #{pane_title}"
set -g pane-border-status off

# tmux 内部优先使用自己的 terminfo；缺失时逐级安全降级。
set -g default-terminal "screen"
if-shell 'infocmp -x screen-256color >/dev/null 2>&1' \
  'set -g default-terminal "screen-256color"'
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"'

# 只为当前实际使用的终端类型声明 RGB，避免把所有 *256* 终端误判为真彩。
# 固定数组下标保证配置可重复加载；嵌套 tmux 也可以安全使用 RGB。
if-shell 'tmux -V | awk '\''{ split($2, v, "."); exit !((v[1] > 3) || (v[1] == 3 && v[2] >= 2)) }'\''' \
  'set -s terminal-features[100] "xterm-256color:RGB"'
if-shell 'tmux -V | awk '\''{ split($2, v, "."); exit !((v[1] > 3) || (v[1] == 3 && v[2] >= 2)) }'\''' \
  'set -s terminal-features[101] "tmux-256color:RGB"'

# 不全局强制 synchronized updates。若所有 xterm-256color 客户端都确认
# 支持 Mode 2026，可将上面的 xterm-256color:RGB 改为 xterm-256color:RGB:sync。

##### =========================
#####   键位与行为
##### =========================

# 使用 C-x 作为前缀键
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Vim 风格复制模式
set -g status-keys vi
set -g mode-keys vi

# 新窗口/分屏继承当前路径
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"

# 快速切换窗口
bind ',' select-window -p
bind '.' select-window -n
bind a last

# 搜索会话/窗口树（支持 / 搜索 + vim 导航）
bind s choose-tree -Zs
bind w choose-tree -Zw

# 数字键直跳窗口
bind -r 1 select-window -t :=1
bind -r 2 select-window -t :=2
bind -r 3 select-window -t :=3
bind -r 4 select-window -t :=4
bind -r 5 select-window -t :=5
bind -r 6 select-window -t :=6
bind -r 7 select-window -t :=7
bind -r 8 select-window -t :=8
bind -r 9 select-window -t :=9

# Tab 快速切回上一个窗口
bind Tab last-window

# fzf 窗口模糊搜索（需要 fzf 可用）
if-shell 'command -v fzf >/dev/null 2>&1' {
  bind f display-popup -E -w 80% -h 60% \
    "~/.config/tmux/scripts/fzf-window.sh"
  # 保留原始 find-window 到 prefix+F
  bind F command-prompt -p "find window" { find-window -Z "%%" }
}

# prefix+g → 输入任意窗口编号（解决 >9 窗口）
bind g command-prompt -p "goto window" { select-window -t ":%%" }


##### =========================
#####   自动命名（命令限长 + 最后一级目录）
##### =========================

set -g automatic-rename off
set -g automatic-rename-format "#{=12:pane_current_command} ┆ #{b:pane_current_path}"

##### =========================
#####   状态栏（美化版）
##### =========================

# 刷新频率
set -g status-interval 5

# 左右对齐方式
set -g status-justify left

# 活动提示
setw -g monitor-activity on
set -g visual-activity on

# 状态栏整体样式（Catppuccin 风格）
set -g status-style "bg=#1e1e1e,fg=#c0c0c0"

# 左侧：Session
set -g status-left-length 60
set -g status-left "#[fg=#89b4fa,bold] #S "

# 右侧：Prefix + CPU + RAM + Time。使用普通文本，避免依赖 Nerd Font。
set -g status-right-length 120
set -g status-right "\
#[fg=#f38ba8]#{prefix_highlight} \
#[fg=#6c7086]│ #[fg=#fab387]CPU #{cpu_percentage} \
#[fg=#6c7086]│ #[fg=#a6e3a1]RAM #{ram_percentage} \
#[fg=#6c7086]│ #[fg=#cdd6f4]%H:%M \
"

# tmux-net-speed 依赖 Linux 的 /proc 与 /sys，仅在 Linux 上添加网速段。
if-shell 'test "$(uname -s)" = "Linux"' {
  set -g status-right "\
#[fg=#f38ba8]#{prefix_highlight} \
#[fg=#6c7086]│ #[fg=#fab387]CPU #{cpu_percentage} \
#[fg=#6c7086]│ #[fg=#a6e3a1]RAM #{ram_percentage} \
#[fg=#6c7086]│ #[fg=#89b4fa]NET #{net_speed} \
#[fg=#6c7086]│ #[fg=#cdd6f4]%H:%M \
"
}

# 窗口列表样式
setw -g window-status-format " #[fg=#6c7086]#I:#W "
setw -g window-status-current-format " #[fg=#f9e2af,bold]#I:#W#F "
setw -g window-status-current-style "bg=#313244"
setw -g window-status-last-style "fg=#443CE7"

# 提示消息样式
set -g message-style "bg=#313244,fg=#cdd6f4"


##### =========================
#####   Prefix Highlight
##### =========================

set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg '#f38ba8'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=#f9e2af'


##### =========================
#####   TPM 插件管理
##### =========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-net-speed 当前只支持 Linux。
if-shell 'test "$(uname -s)" = "Linux"' \
  'set -g @plugin "tmux-plugins/tmux-net-speed"'

# 会话保存/恢复
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '60'
set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-shell-history 'on'
set -g @resurrect-processes '"nvim->nvim +SLoad"'


# 插件由 termcfg sync 显式准备；载入配置不会访问网络。
if-shell 'test -x "${XDG_DATA_HOME:-$HOME/.local/share}/termcfg/packages/plugins/tmux/current/tpm/tpm"' \
  'run-shell "TMUX_PLUGIN_MANAGER_PATH=\"${XDG_DATA_HOME:-$HOME/.local/share}/termcfg/packages/plugins/tmux/current\" \"${XDG_DATA_HOME:-$HOME/.local/share}/termcfg/packages/plugins/tmux/current/tpm/tpm\""'

# Agent 状态感知（gentle-agent-state）
source-file -q ~/.config/tmux/agents.conf
